#
# NETDISCO 2 CONFIGURATION FILE
#
# Settings in this file override share/config.yml
#
# https://github.com/netdisco/netdisco/wiki/Configuration

# ------------------
# ESSENTIAL SETTINGS
# ------------------

database:
  name: 'netdisco'
  user: 'netdisco'
  pass: 'netdisco'

# ------------------------
# DOCKER SPECIFIC SETTINGS
# ------------------------

# Allows you to put plugin code in /lib, and templates in /share/views,
# within the nd-site-local directory.
site_local_files: true

# First start only: no_auth is true so you can log in as "guest" and create a real admin
# (Admin -> User Management). Then set no_auth: false and save; the daemons reload.
# Until then the web UI is bound to LOCAL_BIND_IP (127.0.0.1 by default) - reach it via SSH tunnel.
# Ref: https://github.com/netdisco/netdisco-docker#readme
no_auth: true

# --------------------
# RECOMMENDED SETTINGS
# --------------------

# Device authentication settings
# define snmp communities here
device_auth:
  - tag: 'default_v2_readonly'
    # Set the same value as SNMP_COMMUNITY in .env. Never leave the vendor default 'public'.
    community: 'CHANGE_ME'
    read: true
    write: false
