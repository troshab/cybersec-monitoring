# =============================================================================
# Cybersec Monitoring Stack - Docker Compose
# =============================================================================
# Prometheus, Loki, Grafana, Alertmanager
# Versions: see README "Версії компонентів" (single source of truth)
# Bind addresses: LOCAL_BIND_IP (default 127.0.0.1), LOKI_BIND_IP and
# GRAFANA_BIND_IP (default 0.0.0.0, needed by agents and operators).
# =============================================================================

services:
  # ===========================================================================
  # Prometheus - Збір метрик
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}'
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Loki - Зберігання логів
  # ===========================================================================
  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    command: -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_BIND_IP:-0.0.0.0}:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Grafana - Візуалізація та алерти
  # ===========================================================================
  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    restart: unless-stopped
    user: "472:472"
    ports:
      - "${GRAFANA_BIND_IP:-0.0.0.0}:${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://${MONITORING_SERVER_IP}:${GRAFANA_PORT:-3000}
      - GF_LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Alertmanager - Маршрутизація сповіщень
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://${MONITORING_SERVER_IP}:${ALERTMANAGER_PORT:-9093}'
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - mailpit

  # ===========================================================================
  # Mailpit - Локальний SMTP для демо (catch-all email з Web UI)
  # ===========================================================================
  # Web UI: http://127.0.0.1:8025 (LOCAL_BIND_IP)
  # SMTP: 127.0.0.1:1025 (без автентифікації; доступ з контейнерів через mailpit:1025)
  # Для production замініть на справжній SMTP сервер
  # ===========================================================================
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: mailpit
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${LOCAL_BIND_IP:-127.0.0.1}:${MAILPIT_WEB_PORT:-8025}:8025"
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8025/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
  # ===========================================================================
  # SNMP Exporter - метрики мережевого обладнання (CIS IG1 4.2, 12.1; картки CF-02, NET-01)
  # Community береться з SNMP_COMMUNITY у .env і пишеться в тимчасовий файл auth "org_v2"
  # (snmp_exporter не підставляє змінні середовища в поле community).
  # Ref: https://github.com/prometheus/snmp_exporter
  # ===========================================================================
  snmp-exporter:
    image: prom/snmp-exporter:v0.30.1
    container_name: snmp-exporter
    restart: unless-stopped
    environment:
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:?set SNMP_COMMUNITY in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf 'auths:\n  org_v2:\n    community: "%s"\n    version: 2\n' "$$SNMP_COMMUNITY" > /tmp/auth.yml &&
        exec /bin/snmp_exporter --config.file=/etc/snmp_exporter/snmp.yml --config.file=/tmp/auth.yml
    networks:
      - monitoring

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
